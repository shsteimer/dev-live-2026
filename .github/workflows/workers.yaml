name: Deploy workers
on:
  push:
    branches: [main]
    paths: ['workers/**']
  workflow_dispatch:
    inputs:
      worker:
        description: 'Worker folder name, or "all"'
        default: all

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        env:
          INPUT: ${{ github.event.inputs.worker }}
          BEFORE: ${{ github.event.before }}
        run: |
          all=$(find workers -mindepth 2 -maxdepth 2 -name wrangler.toml | cut -d/ -f2 | sort)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$INPUT" = all ] && list="$all" || list="$INPUT"
          elif ! git cat-file -e "$BEFORE" 2>/dev/null || git diff --name-only "$BEFORE" HEAD | grep -qE '^workers/[^/]+$'; then
            list="$all"
          else
            changed=$(git diff --name-only "$BEFORE" HEAD | grep '^workers/[^/]*/' | cut -d/ -f2 | sort -u)
            if echo "$changed" | grep -qvFxf <(echo "$all"); then
              list="$all"
            else
              list="$changed"
            fi
          fi
          targets=$(for w in $list; do
            echo "{\"worker\":\"$w\",\"env\":\"\"}"
            sed -nE 's/^\[env\.([A-Za-z0-9_-]+)\]$/\1/p' "workers/$w/wrangler.toml" | while read -r e; do
              echo "{\"worker\":\"$w\",\"env\":\"$e\"}"
            done
          done | jq -sc '.')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  deploy:
    needs: detect
    if: needs.detect.outputs.targets != '[]' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.detect.outputs.targets) }}
    name: deploy ${{ matrix.target.worker }} ${{ matrix.target.env || 'production' }}
    defaults:
      run:
        working-directory: workers
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: ${{ matrix.target.worker }}
      WORKER_ENV: ${{ matrix.target.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx wrangler deploy -c "$WORKER/wrangler.toml" ${WORKER_ENV:+--env "$WORKER_ENV"}
      - name: Push worker secrets
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          prefix="$(echo "$WORKER${WORKER_ENV:+_$WORKER_ENV}" | tr '[:lower:]-' '[:upper:]_')__"
          echo "$ALL_SECRETS" | jq --arg p "$prefix" 'with_entries(select(.key | startswith($p)) | .key |= ltrimstr($p))' > /tmp/secrets.json
          if [ "$(jq length /tmp/secrets.json)" -gt 0 ]; then
            npx wrangler secret bulk /tmp/secrets.json -c "$WORKER/wrangler.toml" ${WORKER_ENV:+--env "$WORKER_ENV"}
          fi
          rm -f /tmp/secrets.json
