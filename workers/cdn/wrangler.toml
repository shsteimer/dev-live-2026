name = "dev-live-cdn"
main = "src/index.js"
compatibility_date = "2025-03-17"
workers_dev = true

# routes = [{ pattern = "devlive.shsteimer.com/*", zone_name = "shsteimer.com" }]

[vars]
ORIGIN_HOSTNAME = "main--dev-live-2026--shsteimer.aem.live"
# Repoless: host -> origin, or { origin, tokenSecret } for sites with origin auth.
SITES = '''
{
  "devlive.shsteimer.com": "main--dev-live-2026--shsteimer.aem.live"
}
'''

# Stage: same code, ?ref={branch} picks the aem.live branch. Deploy with --env stage.
[env.stage]
name = "dev-live-cdn-stage"
# routes = [{ pattern = "stage.devlive.shsteimer.com/*", zone_name = "shsteimer.com" }]

[env.stage.vars]
MODE = "stage"
DEFAULT_REF = "main"
ORIGIN_HOSTNAME = "main--dev-live-2026--shsteimer.aem.live"
SITES = '''
{
  "stage.devlive.shsteimer.com": "main--dev-live-2026--shsteimer.aem.live"
}
'''
